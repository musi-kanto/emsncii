name: emsncii
description: Emergency Medical Services NC II Mobile Reviewer Application - TESDA Competency Assessment Preparation
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.2.0
  
  # Local Storage
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0
  
  # Serialization
  json_serializable: ^6.7.0
  freezed_annotation: ^2.4.1
  
  # UI/UX
  animations: ^2.0.7
  lottie: ^2.4.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # Audio
  audioplayers: ^5.2.0
  text_to_speech: ^0.2.3
  
  # Navigation
  go_router: ^10.0.0
  
  # Date/Time
  intl: ^0.18.1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Logging & Analytics
  logger: ^2.0.1
  
  # Notifications
  flutter_local_notifications: ^14.1.0
  
  # QR/Barcode (for emergency codes)
  mobile_scanner: ^3.5.0
  
  # Device Info
  device_info_plus: ^9.1.0
  connectivity_plus: ^5.0.0
  
  # Permission Handling
  permission_handler: ^11.4.0
  
  # Accessibility
  flutter_tts: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.1
  hive_generator: ^2.0.0
  
  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - assets/data/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
